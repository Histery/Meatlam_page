<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrada - Cámara</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <h1>📥 Entrada</h1>

    <div class="campo">
    <label>Producto</label>
    <input type="text" id="producto" placeholder="Escribe para buscar..." autocomplete="off">
    <div id="sugerencias" class="sugerencias"></div>
</div>

    <div class="campo">
    <label>Peso (kg)</label>
    <div id="display-peso" class="display-peso">0.000</div>
    <div class="teclado">
        <button class="tecla" data-num="7">7</button>
        <button class="tecla" data-num="8">8</button>
        <button class="tecla" data-num="9">9</button>
        <button class="tecla" data-num="4">4</button>
        <button class="tecla" data-num="5">5</button>
        <button class="tecla" data-num="6">6</button>
        <button class="tecla" data-num="1">1</button>
        <button class="tecla" data-num="2">2</button>
        <button class="tecla" data-num="3">3</button>
        <button class="tecla" data-num=".">.</button>
        <button class="tecla" data-num="0">0</button>
        <button class="tecla tecla-borrar" data-accion="borrar">⌫</button>
    </div>
</div>

    <button id="btn-aceptar">✅ Aceptar entrada</button>

    <p id="resultado"></p>

    <a href="/" class="volver">← Volver al inicio</a>

    <script src="{{ url_for('static', filename='entrada.js') }}"></script>
</body>
</html>
